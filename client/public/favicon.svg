<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Rounded Badge Background -->
  <rect width="512" height="512" rx="140" fill="url(#bg)" />
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="28" />
  <!-- Compass Needle - North -->
  <polygon points="256,120 282,242 256,230" fill="#ffffff" />
  <polygon points="256,120 230,242 256,230" fill="#fef08a" />
  <!-- Compass Needle - South -->
  <polygon points="256,392 282,270 256,282" fill="#fef08a" />
  <polygon points="256,392 230,270 256,282" fill="#ffffff" />
  <!-- Compass Needle - East -->
  <polygon points="392,256 270,282 282,256" fill="#ffffff" />
  <polygon points="392,256 270,230 282,256" fill="#fef08a" />
  <!-- Compass Needle - West -->
  <polygon points="120,256 242,282 230,256" fill="#fef08a" />
  <polygon points="120,256 242,230 230,256" fill="#ffffff" />
  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="26" fill="#ffffff" />
  <circle cx="256" cy="256" r="14" fill="#059669" />
</svg>
